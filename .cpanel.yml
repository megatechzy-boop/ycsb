---
# cPanel Git Version Control deployment
# Runs on "Deploy HEAD Commit" and copies the website into the ycbhavan.org document root.
# Files that exist only on the server (includes/config.local.php) are not touched.
deployment:
  tasks:
    - export DEPLOYPATH=/home/venutaihall/ycbhavan.org/
    - /bin/mkdir -p $DEPLOYPATH
    - /bin/cp -R *.php .htaccess favicon.ico assets en includes $DEPLOYPATH
    - /bin/find $DEPLOYPATH -type d -exec /bin/chmod 755 {} \;
    - /bin/find $DEPLOYPATH -type f -exec /bin/chmod 644 {} \;
